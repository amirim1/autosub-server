# Public AutoSub JSON reverse proxy.
# 3x-ui remains on its current port: https://sub.your-domain.com:2096
# In 3x-ui set "JSON reverse proxy URI" to:
# https://sub.your-domain.com:2097/json/
# AutoSub itself listens locally: http://127.0.0.1:25500

server {
    listen 2097 ssl http2;
    server_name sub.your-domain.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/sub.your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sub.your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # JSON subscriptions go through AutoSub.
    location /json/ {
        proxy_pass http://127.0.0.1:25500/json/;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 45s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Legacy /sub/ URLs: local browser landing or generated JSON for VPN clients.
    location /sub/ {
        proxy_pass http://127.0.0.1:25500/sub/;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 45s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # This port is only for AutoSub JSON links.
    location / {
        return 404;
    }
}
